name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build source package
      run: dpkg-buildpackage -S

    - name: Upload source artifacts
      uses: actions/upload-artifact@v4
      with:
        name: source
        path: |
          ../corsair-lncore-dkms_*.dsc
          ../corsair-lncore-dkms_*.debian.tar.xz
          ../corsair-lncore-dkms_*.orig.tar.gz