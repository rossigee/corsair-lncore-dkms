name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build kernel module
      run: make

    - name: Create tarball
      run: make tarball

    - name: Build Debian package
      run: dpkg-buildpackage -us -uc

    - name: Upload tarball
      uses: actions/upload-artifact@v3
      with:
        name: tarball
        path: corsair-lncore-dkms_*.orig.tar.gz

    - name: Upload deb
      uses: actions/upload-artifact@v3
      with:
        name: deb
        path: ../corsair-lncore-dkms_*.deb