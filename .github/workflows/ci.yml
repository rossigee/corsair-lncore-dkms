name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - uses: github/codeql-action/init@v3
      with:
        languages: c
    - uses: github/codeql-action/autobuild@v3
    - uses: github/codeql-action/analyze@v3

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build source package
      run: dpkg-buildpackage -S

    - name: Build binary packages
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms
        dpkg-buildpackage -us -uc

    - name: Move package files for upload
      run: |
        mv ../corsair-lncore-dkms_*.dsc .
        mv ../corsair-lncore-dkms_*.debian.tar.xz .
        mv ../corsair-lncore-dkms_*.orig.tar.gz .
        mv ../corsair-lncore-dkms_*.deb .
        mv ../corsair-lncore-cli_*.deb .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          corsair-lncore-dkms_*.dsc
          corsair-lncore-dkms_*.debian.tar.xz
          corsair-lncore-dkms_*.orig.tar.gz
          corsair-lncore-dkms_*.deb
          corsair-lncore-cli_*.deb