name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set version
      run: |
        VERSION_TAG=${GITHUB_REF_NAME#v}
        FULL_VERSION=$(dpkg-parsechangelog --show-field Version)
        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build binary package
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms
        dpkg-buildpackage -us -uc

    - name: Move package files
      run: mv ../corsair-lncore-dkms_*.deb .

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Debian package for v${{ env.VERSION_TAG }}.
          Download and install with: sudo dpkg -i corsair-lncore-dkms_*.deb
        draft: false
        prerelease: false
        files: |
          ./corsair-lncore-dkms_${{ env.FULL_VERSION }}_all.deb