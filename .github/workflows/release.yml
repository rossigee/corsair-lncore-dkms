name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build source package
      run: dpkg-buildpackage -S

    - name: Move source files
      run: mv ../corsair-lncore-dkms_* .

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Source package for ${{ github.ref_name }}.
          Download and build with: dpkg-buildpackage -us -uc
        draft: false
        prerelease: false
        files: |
          ./corsair-lncore-dkms_${{ env.VERSION }}.dsc
          ./corsair-lncore-dkms_${{ env.VERSION }}.debian.tar.xz
          ./corsair-lncore-dkms_${{ env.VERSION }}.orig.tar.gz