name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set version
      run: |
        VERSION_TAG=${GITHUB_REF_NAME#v}
        FULL_VERSION=$(dpkg-parsechangelog --show-field Version)
        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms debhelper devscripts build-essential

    - name: Build binary package
      run: |
        sudo apt-get update
        sudo apt-get install -y dkms
        dpkg-buildpackage -us -uc

    - name: Move package files
      run: mv ../corsair-lncore-*.deb .

    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Debian packages for v${{ env.VERSION_TAG }}.

          **Packages:**
          - `corsair-lncore-dkms_${{ env.FULL_VERSION }}_all.deb` - DKMS kernel module
          - `corsair-lncore-cli_${{ env.FULL_VERSION }}_amd64.deb` - Command-line tool

          **Installation:**
          ```bash
          # Install both packages
          sudo dpkg -i corsair-lncore-dkms_${{ env.FULL_VERSION }}_all.deb
          sudo dpkg -i corsair-lncore-cli_${{ env.FULL_VERSION }}_amd64.deb

          # Or install just the DKMS module and build CLI from source
          sudo dpkg -i corsair-lncore-dkms_${{ env.FULL_VERSION }}_all.deb
          cd cln-cli && make && sudo make install
          ```
        draft: false
        prerelease: false
        files: |
          ./corsair-lncore-dkms_${{ env.FULL_VERSION }}_all.deb
          ./corsair-lncore-cli_${{ env.FULL_VERSION }}_amd64.deb